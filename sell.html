<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Become a Seller - Design Makers</title>
    <link rel="icon" type="image/png" href="Logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --rosewood: #8a1c42;
        --rosewood-dark: #6b1433;
        --blush: #f8ecef;
        --blush-line: #ecd7dd;
        --gold: #b8863f;
        --cream: #fffdfb;
        --ink: #2a231f;
        --muted: #8c7d78;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--blush);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 32px 16px;
      }
      .page {
        width: 100%;
        max-width: 480px;
      }
      .brand {
        text-align: center;
        margin-bottom: 20px;
      }
      .brand img { height: 44px; margin-bottom: 8px; }
      .brand .name {
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: 1.3em;
        color: var(--rosewood);
      }
      .card {
        background: var(--cream);
        border: 1px solid var(--blush-line);
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 8px 30px rgba(138,28,66,0.08);
      }
      h1 {
        font-family: "Playfair Display", serif;
        font-size: 1.4em;
        margin-bottom: 6px;
        color: var(--ink);
      }
      .desc {
        font-size: 0.9em;
        color: var(--muted);
        margin-bottom: 20px;
        line-height: 1.4;
      }
      label {
        font-size: 0.85em;
        color: var(--ink);
        display: block;
        margin-bottom: 4px;
        margin-top: 14px;
        font-weight: 500;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"] {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--blush-line);
        border-radius: 8px;
        font-size: 0.95em;
        font-family: inherit;
        background: #fff;
      }
      input[type="file"] { font-size: 0.85em; }
      .hint {
        font-size: 0.78em;
        color: var(--muted);
        margin-top: 4px;
      }
      .error {
        display: none;
        background: #fde8ec;
        color: #a5133a;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.85em;
        margin-top: 16px;
      }
      .success {
        display: none;
        text-align: center;
      }
      .success h2 {
        font-family: "Playfair Display", serif;
        color: var(--rosewood);
        margin-bottom: 8px;
      }
      .success p { color: var(--muted); font-size: 0.9em; }
      button.submit {
        width: 100%;
        margin-top: 20px;
        padding: 13px;
        background: var(--rosewood);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
      }
      button.submit:disabled { opacity: 0.6; cursor: default; }
      .back-link {
        display: block;
        text-align: center;
        margin-top: 18px;
        font-size: 0.85em;
        color: var(--muted);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="brand">
        <img src="Logo.png" alt="Design Makers" />
        <div class="name">DESIGN MAKERS</div>
      </div>

      <div class="card">
        <div id="formSection">
          <h1>Become a seller</h1>
          <p class="desc">Fill this in and we'll review your application. You'll get your Seller ID and password by email once approved.</p>

          <label for="applyName">Full name</label>
          <input type="text" id="applyName" />

          <label for="applyEmail">Email address</label>
          <input type="email" id="applyEmail" />

          <label for="applyPhone">Phone number</label>
          <input type="tel" id="applyPhone" />

          <label for="applyShopTitle">Your shop title</label>
          <input type="text" id="applyShopTitle" />

          <label for="applyAadhaar">Aadhaar number (12 digits)</label>
          <input type="text" id="applyAadhaar" maxlength="12" />
          <div class="hint">We only keep the last 4 digits on file — used to match against the photo below.</div>

          <label for="applyPersonPhoto">Your photo (a clear selfie or headshot)</label>
          <input type="file" id="applyPersonPhoto" accept="image/*" />

          <label for="applyAadhaarPhoto">Photo of your Aadhaar card</label>
          <input type="file" id="applyAadhaarPhoto" accept="image/*" />

          <div class="error" id="sellerApplyError"></div>

          <button class="submit" id="submitBtn" onclick="submitSellerApplication()">Submit application</button>
        </div>

        <div class="success" id="successSection">
          <h2>Application submitted!</h2>
          <p id="successMsg"></p>
        </div>
      </div>

      <a class="back-link" href="/">← Back to Design Makers</a>
    </div>

    <script>
      async function submitSellerApplication() {
        const errorEl = document.getElementById("sellerApplyError");
        errorEl.style.display = "none";

        const name = document.getElementById("applyName").value.trim();
        const email = document.getElementById("applyEmail").value.trim();
        const phone = document.getElementById("applyPhone").value.trim();
        const shopTitle = document.getElementById("applyShopTitle").value.trim();
        const aadhaar = document.getElementById("applyAadhaar").value.trim();
        const personPhotoInput = document.getElementById("applyPersonPhoto");
        const fileInput = document.getElementById("applyAadhaarPhoto");

        if (!name || !email || !phone || !shopTitle || aadhaar.length !== 12) {
          errorEl.textContent = "Please fill in every field with a valid 12-digit Aadhaar number.";
          errorEl.style.display = "block";
          return;
        }
        if (!personPhotoInput.files || !personPhotoInput.files[0]) {
          errorEl.textContent = "Please upload a photo of yourself.";
          errorEl.style.display = "block";
          return;
        }
        if (!fileInput.files || !fileInput.files[0]) {
          errorEl.textContent = "Please upload a photo of your Aadhaar card.";
          errorEl.style.display = "block";
          return;
        }

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";

        const personPhoto = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(personPhotoInput.files[0]);
        });
        const aadhaarPhoto = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(fileInput.files[0]);
        });

        try {
          const res = await fetch("/api/seller-applications", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, phone, shopTitle, aadhaar, personPhoto, aadhaarPhoto }),
          });
          const data = await res.json();
          if (!data.success) {
            errorEl.textContent = data.message || "Could not submit application.";
            errorEl.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit application";
            return;
          }
          document.getElementById("formSection").style.display = "none";
          document.getElementById("successMsg").textContent =
            "We'll email you at " + email + " once it's reviewed.";
          document.getElementById("successSection").style.display = "block";
        } catch (error) {
          errorEl.textContent = "Could not submit application. Please try again.";
          errorEl.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit application";
        }
      }
    </script>
  </body>
</html>
